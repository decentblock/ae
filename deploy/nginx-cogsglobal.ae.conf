# COGS Global static site — place in /etc/nginx/sites-available/cogsglobal.ae
# Document root = contents of dist/ (not the dist folder itself)

server {
    listen 80;
    listen [::]:80;
    server_name cogsglobal.ae www.cogsglobal.ae;

    root /var/www/cogsglobal.ae;
    index index.html;

    # Redirect www → apex (matches SEO canonical policy)
    if ($host = www.cogsglobal.ae) {
        return 301 https://cogsglobal.ae$request_uri;
    }

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~* \.(css|js|svg|ico|woff2?|jpg|jpeg|png|webp|gif)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location = /robots.txt {
        access_log off;
    }

    location = /sitemap.xml {
        access_log off;
    }
}

# After certbot: it will add a second server {} block for 443 ssl